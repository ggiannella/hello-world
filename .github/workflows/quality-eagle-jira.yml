name: Send Quality Eagle checklist to Jira

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: read
  pull-requests: read

concurrency:
  group: qe-jira-${{ github.repository }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  forward-checklist:
    if: >-
      github.repository == vars.QE_APPROVED_REPOSITORY &&
      github.event.issue.pull_request &&
      format('{0}', github.event.comment.user.id) == vars.QE_GITHUB_USER_ID &&
      (contains(github.event.comment.body, '<!-- qe-plan:') ||
      contains(github.event.comment.body, 'Quality Eagle'))
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Forward current checklist
        uses: actions/github-script@v9
        env:
          JIRA_AUTOMATION_URL: ${{ secrets.JIRA_AUTOMATION_URL }}
          JIRA_AUTOMATION_TOKEN: ${{ secrets.JIRA_AUTOMATION_TOKEN }}
          QE_GITHUB_USER_ID: ${{ vars.QE_GITHUB_USER_ID }}
        with:
          script: |
            const url = process.env.JIRA_AUTOMATION_URL;
            const token = process.env.JIRA_AUTOMATION_TOKEN;

            if (!url || !token) {
              throw new Error('Missing Jira automation URL or token.');
            }

            // Read current state rather than forwarding an older event snapshot.
            const [commentResult, prResult] = await Promise.all([
              github.rest.issues.getComment({
                ...context.repo,
                comment_id: context.payload.comment.id
              }),
              github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.issue.number
              })
            ]);

            const comment = commentResult.data;
            const pr = prResult.data;
            const body = comment.body || '';

            if (String(comment.user.id) !== process.env.QE_GITHUB_USER_ID) {
              throw new Error('Unexpected checklist comment author.');
            }

            const planMarkers = [...body.matchAll(
              /^<!-- qe-plan:([0-9a-f-]{36}) -->\r?$/gim
            )];

            const hasChecklistHeading = /^#{1,6}[ \t]+Quality Eagle\b[^\r\n]*$/im.test(body);
            if (planMarkers.length > 1 || (!hasChecklistHeading && planMarkers.length !== 1)) {
              throw new Error('Expected a Quality Eagle heading or one QE plan marker.');
            }

            const issueKeys = [...new Set(
              pr.title.match(/\bETMS-[1-9]\d*\b/g) || []
            )];

            if (issueKeys.length !== 1) {
              throw new Error('PR title must contain exactly one ETMS ticket key.');
            }

            // Smart Checklist uses -, +, and x statuses and > lines for item details.
            function checklistToSmartMarkdown(markdown) {
              const items = [];
              const evidenceLines = [];
              const seen = new Set();
              let heading = '';
              let inEvidence = false;
              for (const line of markdown.split(/\r?\n/)) {
                if (!line.trim() || line === '</details>') continue;
                if (line === '<details><summary>Supporting evidence</summary>') {
                  inEvidence = true;
                  continue;
                }
                const detail = line.replace(/^>\s*/, '').replace(/^<!--\s*|\s*-->$/g, '');
                if (/^qe-(?:action|plan|head):/i.test(detail)
                    || /^\d+ completed\b/.test(detail)
                    || detail.startsWith('Revision: ')
                    || detail === '**Checklist context**'
                    || detail.startsWith('Completion records developer confirmation')) continue;
                if (!inEvidence && /^#{1,6} /.test(line) && !heading) {
                  heading = line;
                  continue;
                }
                const action = !inEvidence && line.match(
                  /^([-+x]) (?:\[([ xX])\] )?(.+) <!-- qe-action:([0-9a-f-]{36}):([1-9]\d*) -->\s*$/i
                );
                if (action) {
                  const actionId = action[4].toLowerCase();
                  if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(actionId)) {
                    throw new Error('Task row has an invalid QE action ID.');
                  }
                  if (seen.has(actionId)) throw new Error('Duplicate QE action ID.');
                  seen.add(actionId);
                  const status = action[2] === undefined
                    ? action[1].toLowerCase()
                    : action[2].toLowerCase() === 'x' ? '+' : '-';
                  items.push([status + ' ' + action[3]]);
                } else if (!inEvidence && /^- \[[ xX]?\]/.test(line)) {
                  throw new Error('Task row is missing a valid QE action marker.');
                } else if (!inEvidence && line.startsWith('- Dismissed: ')) {
                  items.push(['x ' + line.slice(2)]);
                } else if (!inEvidence && /^[-+x] .+/i.test(line)) {
                  if (/qe-action:/i.test(line)) {
                    throw new Error('Task row has an invalid QE action marker.');
                  }
                  items.push([line[0].toLowerCase() + line.slice(1)]);
                } else if (!inEvidence && line.startsWith('> ') && items.length) {
                  items.at(-1).push(line);
                } else if (inEvidence) {
                  evidenceLines.push(line);
                }
              }
              if (!items.length) throw new Error('QE checklist has no action items.');
              // Supporting evidence is detail text, never an additional checkbox item.
              if (evidenceLines.length) {
                items[0].push('> **Supporting evidence (all actions)**', ...evidenceLines.map(line => '> ' + line));
              }
              return [heading || '# Quality Eagle testing', ...items.flat()].join('\n');
            }

            const issueKey = issueKeys[0];
            const payload = {
              issues: [issueKey],
              data: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                issueKey,
                checklistId: `pr-${pr.number}-comment-${comment.id}`,
                sourceUpdatedAt: comment.updated_at,
                checklistBody: checklistToSmartMarkdown(body)
              }
            };

            const response = await fetch(url, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              headers: {
                'Content-Type': 'application/json',
                'X-Automation-Webhook-Token': token
              },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`Jira webhook returned HTTP ${response.status}.`);
            }

            core.info(`Jira webhook accepted checklist for ${issueKey}.`);
