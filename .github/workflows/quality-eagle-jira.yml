name: Send Quality Eagle checklist to Jira

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: read
  pull-requests: read

concurrency:
  group: qe-jira-${{ github.repository }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  forward-checklist:
    if: >-
      github.repository == vars.QE_APPROVED_REPOSITORY &&
      github.event.issue.pull_request &&
      format('{0}', github.event.comment.user.id) == vars.QE_GITHUB_USER_ID &&
      contains(github.event.comment.body, '<!-- qe-plan:')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Forward current checklist
        uses: actions/github-script@v9
        env:
          JIRA_AUTOMATION_URL: ${{ secrets.JIRA_AUTOMATION_URL }}
          JIRA_AUTOMATION_TOKEN: ${{ secrets.JIRA_AUTOMATION_TOKEN }}
          QE_GITHUB_USER_ID: ${{ vars.QE_GITHUB_USER_ID }}
        with:
          script: |
            const url = process.env.JIRA_AUTOMATION_URL;
            const token = process.env.JIRA_AUTOMATION_TOKEN;

            if (!url || !token) {
              throw new Error('Missing Jira automation URL or token.');
            }

            // Read current state rather than forwarding an older event snapshot.
            const [commentResult, prResult] = await Promise.all([
              github.rest.issues.getComment({
                ...context.repo,
                comment_id: context.payload.comment.id
              }),
              github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.issue.number
              })
            ]);

            const comment = commentResult.data;
            const pr = prResult.data;
            const body = comment.body || '';

            if (String(comment.user.id) !== process.env.QE_GITHUB_USER_ID) {
              throw new Error('Unexpected checklist comment author.');
            }

            const planMarkers = [...body.matchAll(
              /^<!-- qe-plan:([0-9a-f-]{36}) -->\r?$/gim
            )];

            if (planMarkers.length !== 1) {
              throw new Error('Expected exactly one QE plan marker.');
            }

            const issueKeys = [...new Set(
              pr.title.match(/\bETMS-[1-9]\d*\b/g) || []
            )];

            if (issueKeys.length !== 1) {
              throw new Error('PR title must contain exactly one ETMS ticket key.');
            }

            // Parse the limited Markdown generated by Quality Eagle, not arbitrary Markdown.
            function inlineContent(text) {
              const nodes = [];
              const clean = value => value
                .replace(/\\([\\`*_{}\[\]()#+.!|>~@<-])/g, '$1')
                .replace(/&(amp|lt|gt);/g, (_, entity) => ({
                  amp: '&', lt: '<', gt: '>'
                })[entity]);
              const append = (value, marks) => {
                if (value) nodes.push({
                  type: 'text',
                  text: clean(value),
                  ...(marks ? { marks } : {})
                });
              };
              const tokens = /(?<!\\)(?:\[([^\]\r\n]+)\]\((https?:\/\/[^\s)]+)\)|`([^`\r\n]+)`|\*\*([^*\r\n]+)\*\*)/g;
              let offset = 0;
              for (const match of text.matchAll(tokens)) {
                append(text.slice(offset, match.index));
                if (match[1]) {
                  append(match[1], [{ type: 'link', attrs: { href: match[2] } }]);
                } else {
                  append(match[3] ?? match[4], [{
                    type: match[3] !== undefined ? 'code' : 'strong'
                  }]);
                }
                offset = match.index + match[0].length;
              }
              append(text.slice(offset));
              return nodes;
            }

            function checklistToAdf(markdown, planId) {
              const content = [];
              const seen = new Set();
              for (let line of markdown.split(/\r?\n/)) {
                if (!line.trim() || /^<!-- qe-(plan|head):.* -->$/.test(line)
                    || line === '</details>') continue;
                if (line === '<details><summary>Supporting evidence</summary>') {
                  line = '### Supporting evidence';
                }
                const action = line.match(
                  /^- \[([ xX])\] (.+) <!-- qe-action:([0-9a-f-]{36}):([1-9]\d*) -->\s*$/i
                );
                if (action) {
                  const actionId = action[3].toLowerCase();
                  if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(actionId)) {
                    throw new Error('Task row has an invalid QE action ID.');
                  }
                  if (seen.has(actionId)) throw new Error('Duplicate QE action ID.');
                  seen.add(actionId);
                  let list = content.at(-1);
                  if (list?.type !== 'taskList') {
                    list = {
                      type: 'taskList',
                      attrs: { localId: planId + ':' + actionId },
                      content: []
                    };
                    content.push(list);
                  }
                  list.content.push({
                    type: 'taskItem',
                    attrs: {
                      localId: actionId,
                      state: action[1].toLowerCase() === 'x' ? 'DONE' : 'TODO'
                    },
                    content: [
                      ...inlineContent(action[2]),
                      {
                        type: 'text',
                        text: ' qe-action:' + actionId + ':' + action[4],
                        marks: [{ type: 'code' }]
                      }
                    ]
                  });
                  continue;
                }
                if (/^- \[[ xX]\]/.test(line)) {
                  throw new Error('Task row is missing a valid QE action marker.');
                }
                const heading = line.match(/^(#{1,6}) (.*)$/);
                content.push({
                  type: heading ? 'heading' : 'paragraph',
                  ...(heading ? { attrs: { level: heading[1].length } } : {}),
                  content: inlineContent(heading ? heading[2] : line)
                });
              }
              if (!content.length) throw new Error('QE checklist document is empty.');
              return { type: 'doc', version: 1, content };
            }

            const issueKey = issueKeys[0];
            const payload = {
              issues: [issueKey],
              data: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                issueKey,
                checklistId: `pr-${pr.number}-comment-${comment.id}`,
                sourceUpdatedAt: comment.updated_at,
                checklistBody: body,
                // ADF object for a Jira-side writer; the text comment action cannot render it.
                checklistAdf: checklistToAdf(body, planMarkers[0][1])
              }
            };

            const response = await fetch(url, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              headers: {
                'Content-Type': 'application/json',
                'X-Automation-Webhook-Token': token
              },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`Jira webhook returned HTTP ${response.status}.`);
            }

            core.info(`Jira webhook accepted checklist for ${issueKey}.`);
